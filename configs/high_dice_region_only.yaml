# Stable BCE + Dice control. Run this before adding auxiliary/GAN objectives.
# Tune/freeze on validation only; never change this configuration after viewing test results.
experiment:
  name: high_dice_region_only_lv
  seed: 2026
  deterministic: true

data:
  root: /path/to/CAMUS_public
  nifti_dir: database_nifti
  split_dir: database_split
  train_split_file: subgroup_training.txt
  val_split_file: subgroup_validation.txt
  test_split_file: subgroup_testing.txt
  val_fraction: 0.15
  views: [2CH, 4CH]
  phases: [ED, ES]
  task: binary
  structure: LVendo
  paired_phases: true
  image_size: [256, 256]
  augment: true
  augmentation:
    horizontal_flip_prob: 0.5
    rotation_deg: 8
    translation_fraction: 0.03
    scale_jitter: 0.08
    brightness: 0.08
    contrast: 0.10
    gamma_jitter: 0.12
    percentile_normalization: true

model:
  base_channels: 64
  num_classes: 4
  normalization: instance
  weight_init: normal

loss:
  region_weight: 1.0
  ce_weight: 1.0
  dice_weight: 2.0
  bce_pos_weight: 1.25
  pixel_l1_weight: 0.0
  adversarial_weight: 0.0
  boundary_weight: 0.0
  functional_weight: 0.0
  boundary_tolerance_px: 2
  lv_class: 1
  physiology_weight: 0.10

training:
  epochs: 200
  batch_size: 2
  eval_batch_size: 4
  num_workers: 4
  lr_g: 0.0001
  lr_d: 0.000025
  betas: [0.5, 0.999]
  amp: true
  grad_clip: 5.0
  label_smoothing: 0.0
  label_flip_prob: 0.0
  adversarial_warmup_epochs: 0
  adversarial_ramp_epochs: 0
  d_update_every: 2
  d_update_min_loss: 0.30
  lr_patience: 12
  lr_scheduler_start_epoch: 1
  lr_factor: 0.5
  min_lr: 0.000001
  early_stopping_patience: 40
  early_stopping_min_delta: 0.0001
  checkpoint_every: 50

evaluation:
  threshold: 0.50
  keep_largest_component: true
  fill_holes: true
  original_grid: true
  require_calibration_policy: true
